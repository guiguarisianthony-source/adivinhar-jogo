<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA INICIAL: PEDIR NOME DO USUÁRIO -->
  <div class="container" id="tela-login">
    <h1>Bem-vindo! 👋</h1>
    <p>Digite seu nome de usuário para jogar:</p>
    <input type="text" id="nome-usuario" placeholder="Seu nome ou apelido">
    <br>
    <button onclick="salvarNome()">Entrar no Jogo</button>
  </div>

  <!-- TELA PRINCIPAL DO JOGO (COMEÇA ESCONDIDA) -->
  <div class="container esconde" id="tela-jogo">
    <div class="placar">
      <div class="rank">🏆 TOP 1: Guilherme (67 acertos)</div>
      <div class="jogador-info">👤 Jogador: <span id="nome-exibido"></span></div>
      <div class="streak">🔥 Sequência Atual: <span id="streak">0</span></div>
    </div>

    <h1>Jogo de Adivinhação</h1>
    <p>Tente adivinhar o número entre 1 e 3:</p>
    
    <input type="number" id="chute" min="1" placeholder="Digite 1, 2 ou 3">
    <br>
    <button onclick="adivinhar()">Tentar</button>

    <p id="mensagem"></p>
  </div>

  <!-- TELA POPUP DO MEME 67 -->
  <div id="modal-meme" class="modal esconde">
    <div class="modal-conteudo">
      <button class="fechar" onclick="fecharMeme()">&times;</button>
      
      <video id="video-meme" width="100%" loop playsinline controls style="border-radius: 8px;">
        <source src="meme67.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- TELA POPUP DO CÓDIGO SECRETO 674261 -->
  <div id="modal-secreto" class="modal esconde">
    <div class="modal-conteudo conteudo-secreto">
      <button class="fechar" onclick="fecharSecreto()">&times;</button>
      <h2 class="texto-destaque">VERA SAFADA</h2>
      <h2 class="texto-destaque">CECILIA GULUSA</h2>
      <h2 class="texto-destaque">MARCELA</h2>
    </div>
  </div>

  <div class="creditos">Feito por Guilherme</div>

  <script src="script.js"></script>
</body>
</html>
