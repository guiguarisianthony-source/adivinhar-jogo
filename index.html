<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Jogo de Adivinhação</h1>
    <p>Tente adivinhar o número entre 1 e 3:</p>
    
    <input type="number" id="chute" min="1" max="3" placeholder="Digite 1, 2 ou 3">
    <br>
    <button onclick="adivinhar()">Tentar</button>

    <p id="mensagem"></p>
  </div>

  <div class="creditos">Feito por Guilherme</div>

  <script src="script.js"></script>
</body>
</html>
