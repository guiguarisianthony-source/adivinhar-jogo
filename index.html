<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA PRINCIPAL DO JOGO -->
  <div class="container" id="tela-jogo">
    <div class="placar">
      <div class="rank">🏆 TOP 1: Guilherme (67 acertos consecutivos)</div>
      <div class="streak">🔥 Sequência Atual: <span id="streak">0</span></div>
    </div>

    <h1>Jogo de Adivinhação</h1>
    <p>Tente adivinhar o número entre 1 e 3:</p>
    
    <input type="number" id="chute" min="1" placeholder="Digite 1, 2 ou 3">
    <br>
    <button onclick="adivinhar()">Tentar</button>

    <p id="mensagem"></p>
  </div>

  <!-- TELA POPUP DO MEME 67 -->
  <div id="modal-meme" class="modal esconde">
    <div class="modal-conteudo">
      <button class="fechar" onclick="fecharMeme()">&times;</button>
      
      <!-- Vídeo meme67.mp4 que você subiu -->
      <video id="video-meme" width="300" controls style="border-radius: 8px;">
        <source src="meme67.mp4" type="video/mp4">
        Seu navegador não suporta este vídeo.
      </video>
    </div>
  </div>

  <div class="creditos">Feito por Guilherme</div>

  <script src="script.js"></script>
</body>
</html>
